[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dkjlrday-csvprofile"
version = "0.1.0"
description = "给 CSV 做列级画像，先看清数据再动手"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dkjlrday" }]
keywords = ["csv", "data", "profiling", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/dkjlrday/csvprofile"
Repository = "https://github.com/dkjlrday/csvprofile"
Issues = "https://github.com/dkjlrday/csvprofile/issues"

[project.scripts]
csvprofile = "csvprofile:main"

[tool.setuptools]
py-modules = ["csvprofile"]
